<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV — Jules YZERD</title>
  <meta name="description" content="Jules YZERD — CV download." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .cv-backdrop {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0,0,0,0.04), transparent 60%);
      z-index: -1;
    }
    .cv-modal {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 2.25rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      animation: rise 0.45s ease forwards;
    }
    .cv-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .cv-name {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .cv-sub {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.35rem;
      margin-bottom: 1.75rem;
    }
    .cv-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      padding: 12px 20px;
      border-radius: 100px;
      background: var(--fg);
      color: var(--bg);
      border: 1px solid var(--fg);
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      padding: 11px 20px;
      border-radius: 100px;
      border: 1px solid var(--line);
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .cv-footer-note {
      margin-top: 1.5rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .cv-footer-note a { border-bottom: 1px solid var(--line); }
    .cv-footer-note a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
<div class="cv-backdrop"></div>

<div class="cv-modal">
  <div class="cv-icon">
    <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 2h6l2 2v10H4V2z"/><path d="M10 2v2h2"/><path d="M6 8h4M6 10.5h4"/></svg>
  </div>
  <div class="cv-name">Jules YZERD</div>
  <div class="cv-sub">// CV — updated June 2026</div>

  <div class="cv-actions">
    <a class="btn-primary" href="cv-jules-yzerd.pdf" download>
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8M4.5 7.5L8 11l3.5-3.5M3 13h10"/></svg>
      Download CV (PDF)
    </a>
    <a class="btn-secondary" href="cv-jules-yzerd.pdf" target="_blank" rel="noopener">
      View in browser
    </a>
    <a class="btn-secondary" href="index.html">
      ← Back to portfolio
    </a>
  </div>

  <p class="cv-footer-note">
    Or see the full <a href="index.html">portfolio</a> for projects and open source work.
  </p>
</div>

</body>
</html>
