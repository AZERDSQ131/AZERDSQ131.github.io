<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jules Yzerd — build useful tools</title>
  <meta name="description" content="Jules Yzerd builds developer tools, AI experiments and open source software.">
  <meta name="theme-color" content="#fcfcfa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23101012'/%3E%3Ctext x='50' y='68' text-anchor='middle' fill='%23fcfcfa' font-family='monospace' font-size='52'%3EJY%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=2">
  <script>
    try {
      var s = localStorage.getItem('jy-theme');
      if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {
      try {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e2) {}
    }
  </script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<button id="theme-toggle" type="button" aria-label="Toggle dark theme" aria-pressed="false" title="Light / dark theme">
  <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"></path></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"></path></svg>
</button>
<main id="main">
  <section class="hero"><div class="wrap hero-inner">
    <h1 class="rise"><span class="dim">Build useful tools.</span><br>Ship them in public.</h1>
    <p class="lede rise rise-1">Student, builder and open source contributor. I work where AI, developer tools and curiosity overlap.</p>
    <div class="hero-cta rise rise-2"><a class="btn btn-primary" href="https://github.com/AZERDSQ131" target="_blank" rel="noopener">View GitHub</a><a class="btn btn-ghost" href="mailto:j.yzerd@outlook.fr">Say hello</a></div>
  </div></section>
</main>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    function sync() {
      var dark = document.documentElement.dataset.theme === 'dark';
      btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    }
    btn.addEventListener('click', function () {
      var dark = document.documentElement.dataset.theme !== 'dark';
      if (dark) {
        document.documentElement.dataset.theme = 'dark';
      } else {
        delete document.documentElement.dataset.theme;
      }
      try { localStorage.setItem('jy-theme', dark ? 'dark' : 'light'); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
</body>
</html>
